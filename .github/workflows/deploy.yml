name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify and build JAR
        run: ./mvnw -B verify

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "target/pdf-converter-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"

      - name: Restart app on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            if [ -f /home/ubuntu/app.jar ]; then
              cp /home/ubuntu/app.jar /home/ubuntu/app.jar.bak
            fi
            cp /home/ubuntu/target/pdf-converter-0.0.1-SNAPSHOT.jar /home/ubuntu/app.jar
            sudo systemctl restart pdfconverter
            healthy=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/api/diagnostics/health >/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "Deployment health check failed; restoring the previous application jar."
              if [ -f /home/ubuntu/app.jar.bak ]; then
                cp /home/ubuntu/app.jar.bak /home/ubuntu/app.jar
                sudo systemctl restart pdfconverter
              fi
              exit 1
            fi
            echo "Deployment successful"
